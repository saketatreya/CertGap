[project]
name = "certgap"
version = "0.1.0"
description = "The Certification Gap: an identity-based critic-quality diagnostic for deep RL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "gymnasium[mujoco]>=1.0",
    "mujoco>=3.0",
    "pandas>=2.0",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["certgap*"]
exclude = ["slop*", "tests*", "figures*", "scripts*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end training smoke tests",
]
